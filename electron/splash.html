<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اشک قلم - در حال بارگذاری</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Tahoma, Arial, sans-serif;
            color: #f8fafc;
            overflow: hidden;
            border-radius: 12px;
        }
        .container {
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }
        .logo {
            width: 90px;
            height: 90px;
            background: linear-gradient(to right, #0d9488, #4f46e5);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 10px 25px rgba(13, 148, 136, 0.3);
            position: relative;
        }
        .logo::after {
            content: "AQ";
            font-size: 32px;
            font-weight: bold;
            color: white;
            letter-spacing: 2px;
        }
        .title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px;
            background: linear-gradient(to right, #2dd4bf, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 30px;
        }
        .loader {
            width: 150px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }
        .loader-bar {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 30%;
            background: #2dd4bf;
            border-radius: 4px;
            animation: loading 1.5s infinite ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes loading {
            0% { left: -30%; width: 30%; }
            50% { width: 60%; }
            100% { left: 100%; width: 30%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo"></div>
        <div class="title">سامانه یکپارچه اشک قلم</div>
        <div class="subtitle">در حال راه‌اندازی و بررسی پایگاه داده...</div>
        <div class="loader">
            <div class="loader-bar"></div>
        </div>
    </div>
</body>
</html>
