  <script>
    const isBrowserPreviewHost =
      (window.location.hostname === '127.0.0.1' && window.location.port === '4173') ||
      window.location.hostname.endsWith('.github.io');
    const isNativeAndroid = /AshkeGhalam-Android-Native/i.test(navigator.userAgent);

    // Keep local / hosted preview and Capacitor builds isolated from stale PWA caches.
    if (isBrowserPreviewHost || isNativeAndroid) {
      const cleanupTasks = [];
      if ('serviceWorker' in navigator) {
        cleanupTasks.push(navigator.serviceWorker.getRegistrations().then(registrations => {
          if (registrations.length) {
            return Promise.all(registrations.map(registration => registration.unregister())).then(() => true);
          }
          return false;
        }));
      }
      if ('caches' in window) {
        cleanupTasks.push(caches.keys().then(keys => {
          const staleKeys = keys.filter(key => /^(static|dynamic|images|api)-v/i.test(key));
          return Promise.all(staleKeys.map(key => caches.delete(key))).then(() => staleKeys.length > 0);
        }));
      }
      Promise.all(cleanupTasks).then(results => {
        const cleanupKey = 'ashk-preview-cache-reset-v1';
        if (results.some(Boolean) && sessionStorage.getItem(cleanupKey) !== '1') {
          sessionStorage.setItem(cleanupKey, '1');
          window.location.reload();
        }
      }).catch(() => {});
    } else if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const reg = await navigator.serviceWorker.register('/sw.js');
          console.log('✅ SW registered');
          
          // بررسی آپدیت
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            newWorker?.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                if (confirm('نسخه جدید موجود است. بارگذاری مجدد؟')) {
                  newWorker.postMessage({ type: 'SKIP_WAITING' });
                  window.location.reload();
                }
              }
            });
          });
        } catch (err) {
          console.error('❌ SW error:', err);
        }
      });
    }
  </script>
