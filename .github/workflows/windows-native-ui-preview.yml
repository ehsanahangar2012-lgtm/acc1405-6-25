name: Publish isolated native-Windows UI preview

on:
  push:
    branches:
      - feature/windows-native-dotnet
    paths:
      - 'public/native-windows-preview/**'
      - '.github/workflows/windows-native-ui-preview.yml'
      - 'App.tsx'
      - 'components/**'
      - 'pages/**'
      - 'services/**'
      - 'store.ts'
      - 'types.ts'
      - 'index.html'
      - 'index.css'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-windows-ui-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build isolated browser preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build offline-safe browser preview
        run: bun run build:browser-preview

      - name: Stamp native-Windows UI preview version
        shell: bash
        run: |
          mkdir -p dist/native-windows-preview
          printf '{"build":"%s","sha":"%s","updatedAt":"%s"}\n' "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/version.json
          cp dist/version.json dist/native-windows-preview/version.json

      - name: Upload GitHub Pages package
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy browser preview
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview site
        id: deployment
        uses: actions/deploy-pages@v4
