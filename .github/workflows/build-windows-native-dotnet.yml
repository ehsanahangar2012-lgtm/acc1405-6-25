name: Build Native Windows WPF

on:
  push:
    branches:
      - feature/windows-native-dotnet
    paths:
      - "windows-native-dotnet/**"
      - ".github/workflows/build-windows-native-dotnet.yml"
  pull_request:
    paths:
      - "windows-native-dotnet/**"
      - ".github/workflows/build-windows-native-dotnet.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-native-dotnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore windows-native-dotnet/tests/AshkeGhalam.Windows.Tests.csproj

      - name: Build WPF app
        run: dotnet build windows-native-dotnet/src/AshkeGhalam.Windows/AshkeGhalam.Windows.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test windows-native-dotnet/tests/AshkeGhalam.Windows.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal"

      - name: Publish self-contained Windows x64 EXE
        run: dotnet publish windows-native-dotnet/src/AshkeGhalam.Windows/AshkeGhalam.Windows.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o "$env:RUNNER_TEMP\AshkeGhalam-Windows"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: AshkeGhalam-Windows-WPF-${{ github.sha }}
          path: ${{ runner.temp }}\AshkeGhalam-Windows\**
          if-no-files-found: error
          retention-days: 14
