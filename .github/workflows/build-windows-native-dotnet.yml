name: Build Native Windows WPF

on:
  push:
    branches:
      - feature/windows-native-dotnet
    paths:
      - "windows-native-dotnet/**"
      - ".github/workflows/build-windows-native-dotnet.yml"
  pull_request:
    paths:
      - "windows-native-dotnet/**"
      - ".github/workflows/build-windows-native-dotnet.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-native-dotnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore windows-native-dotnet/tests/AshkeGhalam.Windows.Tests.csproj

      - name: Build WPF app
        run: dotnet build windows-native-dotnet/src/AshkeGhalam.Windows/AshkeGhalam.Windows.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test windows-native-dotnet/tests/AshkeGhalam.Windows.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal"

      - name: Publish self-contained Windows x64 EXE
        run: dotnet publish windows-native-dotnet/src/AshkeGhalam.Windows/AshkeGhalam.Windows.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o "$env:RUNNER_TEMP\AshkeGhalam-Windows"

      - name: Smoke-test published WPF executable startup
        shell: pwsh
        run: |
          $exePath = Join-Path $env:RUNNER_TEMP "AshkeGhalam-Windows\AshkeGhalam.Windows.exe"
          if (-not (Test-Path -LiteralPath $exePath)) {
            throw "Published WPF executable was not found: $exePath"
          }
          $startupLog = Join-Path $env:LOCALAPPDATA "AshkeGhalam\WindowsNative\startup-error.log"
          if (Test-Path -LiteralPath $startupLog) { Remove-Item -LiteralPath $startupLog -Force }
          $startedAt = Get-Date
          $process = Start-Process -FilePath $exePath -PassThru
          Start-Sleep -Seconds 5
          $process.Refresh()
          if ($process.HasExited) {
            $diagnostics = @()
            if (Test-Path -LiteralPath $startupLog) {
              $diagnostics += "Application exception log:"
              $diagnostics += Get-Content -LiteralPath $startupLog -Raw
            }
            try {
              $events = Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $startedAt.AddSeconds(-2) } -ErrorAction SilentlyContinue |
                Where-Object { $_.ProviderName -in @('.NET Runtime', 'Application Error', 'Windows Error Reporting') } |
                Select-Object -First 4
              foreach ($event in $events) {
                $diagnostics += "Event $($event.Id) / $($event.ProviderName):"
                $diagnostics += $event.Message
              }
            } catch {}
            throw "Published WPF executable exited unexpectedly with code $($process.ExitCode). $($diagnostics -join [Environment]::NewLine)"
          }
          Stop-Process -Id $process.Id -Force

      # Actions artifact storage is quota-limited. Use a dedicated parallel-build
      # prerelease asset instead; never publish or alter the main branch.
      - name: Publish tested EXE as a parallel WPF prerelease asset
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exePath = Join-Path $env:RUNNER_TEMP "AshkeGhalam-Windows\AshkeGhalam.Windows.exe"
          if (-not (Test-Path -LiteralPath $exePath)) {
            throw "Published EXE was not found: $exePath"
          }

          $tag = "windows-native-wpf-preview-$env:GITHUB_RUN_NUMBER"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $releaseBody = @"
          Automated native WPF parallel build.
          Branch: feature/windows-native-dotnet
          Commit: $env:GITHUB_SHA
          Build: $env:GITHUB_RUN_NUMBER

          This is a separately installed preview for evaluation alongside the existing app.
          It is not a claim of full module parity and does not replace the existing web/Electron/Android versions.
          "@
          $body = @{
            tag_name = $tag
            target_commitish = $env:GITHUB_SHA
            name = "AshkeGhalam Windows WPF Preview $env:GITHUB_RUN_NUMBER"
            body = $releaseBody
            draft = $false
            prerelease = $true
            make_latest = "false"
          } | ConvertTo-Json -Depth 5

          $releaseUri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases"
          $release = Invoke-RestMethod -Method Post -Uri $releaseUri -Headers $headers -ContentType "application/json" -Body $body
          $uploadBase = $release.upload_url.Split('{')[0]
          $assetName = "AshkeGhalam-Windows-WPF-preview-$env:GITHUB_RUN_NUMBER.exe"
          $assetUri = "$uploadBase?name=$assetName"
          $asset = Invoke-RestMethod -Method Post -Uri $assetUri -Headers $headers -ContentType "application/octet-stream" -InFile $exePath

          $download = $asset.browser_download_url
          "### Native WPF preview

Build: $env:GITHUB_RUN_NUMBER

[Download the self-contained Windows x64 EXE]($download)

This build is a parallel preview; existing app versions remain unchanged." |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Write-Host "Published tested preview asset: $download"
