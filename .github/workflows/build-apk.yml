name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is not set on the GitHub runner}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          # sdkmanager may exit cleanly before 'yes' finishes; avoid treating yes's
          # expected broken pipe as a license-acceptance failure.
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          SDKMANAGER_LICENSE_STATUS="${PIPESTATUS[1]}"
          set -o pipefail
          if [ "$SDKMANAGER_LICENSE_STATUS" -ne 0 ]; then
            exit "$SDKMANAGER_LICENSE_STATUS"
          fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Type-check project
        run: bun run lint

      - name: Build real Android APK
        run: bun run build:apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AshkeGhalam-Android-APK
          path: downloads/AshkeGhalam-v*.apk
          if-no-files-found: error
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Type-check project
        run: bun run lint

      - name: Build real Windows EXE files
        run: bun run build:windows

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AshkeGhalam-Windows-EXE
          path: dist_electron/*.exe
          if-no-files-found: error

