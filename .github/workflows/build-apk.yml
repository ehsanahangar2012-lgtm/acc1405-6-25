name: Build Android APK

# Avoid dozens of stale builds when a PR receives multiple small fixes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, master, fix/core-data-integrity ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:

  build-browser-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Type-check project
        run: bun run lint

      - name: Build local-only browser preview
        run: bun run build:browser-preview

      - name: Mark preview build version
        shell: bash
        run: printf '{"sha":"%s"}\n' "$GITHUB_SHA" > dist/version.json

      - name: Smoke-test local preview server and safety headers
        shell: bash
        run: |
          set -euo pipefail
          node scripts/serve-browser-preview.mjs > /tmp/ashke-browser-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/ -o /tmp/browser-preview-index.html; then
              break
            fi
            sleep 1
          done
          grep -q 'id="root"' /tmp/browser-preview-index.html
          curl --silent --show-error --fail --head http://127.0.0.1:4173/ | grep -qi "content-security-policy:.*connect-src 'self'"
          curl --silent --show-error --fail http://127.0.0.1:4173/invoices -o /tmp/browser-preview-route.html
          grep -q 'id="root"' /tmp/browser-preview-route.html

      - name: Package browser preview
        run: |
          mkdir -p browser-preview-package
          cp -R dist browser-preview-package/dist
          cp scripts/serve-browser-preview.mjs browser-preview-package/serve-browser-preview.mjs
          cp Preview-Browser.bat browser-preview-package/Preview-Browser.bat
          cp README-BROWSER-PREVIEW.md browser-preview-package/README-BROWSER-PREVIEW.md

      - name: Upload browser preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: AshkeGhalam-Browser-Preview
          path: browser-preview-package/
          if-no-files-found: error
          retention-days: 14

      - name: Upload isolated online preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/core-data-integrity'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-browser-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/core-data-integrity'
    needs: build-browser-preview
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy isolated browser preview
        id: deployment
        uses: actions/deploy-pages@v4

  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is not set on the GitHub runner}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          # sdkmanager may exit cleanly before 'yes' finishes; avoid treating yes's
          # expected broken pipe as a license-acceptance failure.
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          SDKMANAGER_LICENSE_STATUS="${PIPESTATUS[1]}"
          set -o pipefail
          if [ "$SDKMANAGER_LICENSE_STATUS" -ne 0 ]; then
            exit "$SDKMANAGER_LICENSE_STATUS"
          fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Type-check project
        run: bun run lint

      - name: Build real Android APK
        run: bun run build:apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AshkeGhalam-Android-APK
          path: downloads/AshkeGhalam-v*.apk
          if-no-files-found: error
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Type-check project
        run: bun run lint

      - name: Build real Windows EXE files
        run: bun run build:windows

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AshkeGhalam-Windows-EXE
          path: dist_electron/*.exe
          if-no-files-found: error

